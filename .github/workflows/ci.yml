name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: "${{ github.ref }}-ci"
  cancel-in-progress: true

jobs:
  markup-lint:
    name: Markup
    uses: devpro/github-workflow-parts/.github/workflows/reusable-markup-lint.yml@1711cf6d760e89fe43e3673dbd8986e355876cca

  code-quality:
    name: Code / Quality
    uses: devpro/github-workflow-parts/.github/workflows/reusable-pages-deployment.yml@1711cf6d760e89fe43e3673dbd8986e355876cca
    with:
      deploy: false
      site-path: build
      workflow-parts-version: 1711cf6d760e89fe43e3673dbd8986e355876cca
