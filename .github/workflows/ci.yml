name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: "${{ github.ref }}-ci"
  cancel-in-progress: true

jobs:
  markup-lint:
    name: Markup
    uses: devpro/github-workflow-parts/.github/workflows/reusable-markup-lint.yml@5379b9d0052e3b233ec2e56ba8678e827361b89e

  code-quality:
    name: Code / Quality
    uses: devpro/github-workflow-parts/.github/workflows/reusable-pages-deployment.yml@5379b9d0052e3b233ec2e56ba8678e827361b89e
    with:
      deploy: false
      site-path: build
      workflow-parts-version: 5379b9d0052e3b233ec2e56ba8678e827361b89e
