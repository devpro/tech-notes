name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: "${{ github.ref }}-ci"
  cancel-in-progress: true

jobs:
  markup-lint:
    name: Markup
    uses: devpro/github-workflow-parts/.github/workflows/reusable-markup-lint.yml@bf95c99bf5b5a0bc2d2991c81975488a16f16142

  code-quality:
    name: Code / Quality
    uses: devpro/github-workflow-parts/.github/workflows/reusable-pages-deployment.yml@bf95c99bf5b5a0bc2d2991c81975488a16f16142
    with:
      deploy: false
      site-path: build
      workflow-parts-version: bf95c99bf5b5a0bc2d2991c81975488a16f16142
