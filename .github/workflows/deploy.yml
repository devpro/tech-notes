name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: "${{ github.ref }}-deploy"
  cancel-in-progress: false

jobs:
  pages:
    name: Pages
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: devpro/github-workflow-parts/.github/workflows/reusable-pages-deployment.yml@591b0c7bfba6fbc7b0cab7d896447e0732b819de
    with:
      fetch-depth: 0
      job-name: Build website
      site-path: build
      workflow-parts-version: 591b0c7bfba6fbc7b0cab7d896447e0732b819de
