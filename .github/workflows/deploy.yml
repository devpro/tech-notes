name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: "${{ github.ref }}-deploy"
  cancel-in-progress: false

jobs:
  pages:
    name: Pages
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: devpro/github-workflow-parts/.github/workflows/reusable-pages-deployment.yml@8c856cd16adc8a0ca01c7889a9c7d98ad8593818
    with:
      fetch-depth: 0
      job-name: Build website
      site-path: build
      workflow-parts-version: 8c856cd16adc8a0ca01c7889a9c7d98ad8593818
