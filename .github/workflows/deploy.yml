name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: "${{ github.ref }}-deploy"
  cancel-in-progress: false

jobs:
  pages:
    name: Pages
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: devpro/github-workflow-parts/.github/workflows/reusable-pages-deployment.yml@c6d06a61a377a41dc192ce58f08a0b5100d9a2bc
    with:
      build-command: |
        npm ci
        npm run build
      fetch-depth: 0
      job-name: Build website
      node-version: "22"
      site-path: build
      workflow-parts-version: c6d06a61a377a41dc192ce58f08a0b5100d9a2bc
