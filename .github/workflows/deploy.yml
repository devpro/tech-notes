name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: "${{ github.ref }}-deploy"
  cancel-in-progress: false

jobs:
  pages:
    name: Pages
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: devpro/github-workflow-parts/.github/workflows/reusable-pages-deployment.yml@398cf79719f90e41e3407bc9f060e297629d800d
    with:
      fetch-depth: 0
      job-name: Build website
      site-path: build
      workflow-parts-version: 398cf79719f90e41e3407bc9f060e297629d800d
