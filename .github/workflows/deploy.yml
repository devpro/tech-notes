name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: "${{ github.ref }}-deploy"
  cancel-in-progress: false

jobs:
  pages:
    name: Pages
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: devpro/github-workflow-parts/.github/workflows/reusable-pages-deployment.yml@bf95c99bf5b5a0bc2d2991c81975488a16f16142
    with:
      fetch-depth: 0
      job-name: Build website
      site-path: build
      workflow-parts-version: bf95c99bf5b5a0bc2d2991c81975488a16f16142
